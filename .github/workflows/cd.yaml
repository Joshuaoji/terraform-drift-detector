name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  EKS_NAMESPACE: ${{ vars.EKS_NAMESPACE || 'driftdetect' }}
  HELM_RELEASE: driftdetect

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.build-image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_SHA::12}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${VERSION}"

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: helm lint ./charts/driftdetect

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [[ -n "${{ vars.ECR_REGISTRY }}" ]]; then
            IMAGE_REPO="${{ vars.ECR_REGISTRY }}/${ECR_REPOSITORY}"
          else
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            IMAGE_REPO="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          fi

          VALUES_FILE="charts/driftdetect/values-eks.example.yaml"
          ENV_NAME="${{ inputs.environment || 'production' }}"
          if [[ -f "charts/driftdetect/values-${ENV_NAME}.yaml" ]]; then
            VALUES_FILE="charts/driftdetect/values-${ENV_NAME}.yaml"
          fi

          helm upgrade --install "${HELM_RELEASE}" ./charts/driftdetect \
            --namespace "${EKS_NAMESPACE}" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 10m \
            -f "${VALUES_FILE}" \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/"${HELM_RELEASE}" \
            --namespace "${EKS_NAMESPACE}" \
            --timeout=5m
          kubectl get pods,svc,ingress \
            --namespace "${EKS_NAMESPACE}" \
            -l "app.kubernetes.io/instance=${HELM_RELEASE}"
