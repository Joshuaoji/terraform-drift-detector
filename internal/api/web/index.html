<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drift Detector</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>Drift Detector</h1>
          <p class="subtitle">Terraform state vs cloud infrastructure</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
        <button id="new-scan-btn" class="btn btn-primary">New Scan</button>
      </div>
    </header>

    <main class="main">
      <section class="panel profiles-panel" id="profiles-panel">
        <h2>Scan Profiles</h2>
        <div id="profiles-list" class="profiles-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Scan History</h2>
          <span id="scan-count" class="badge">0 scans</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Provider</th>
                <th>State Source</th>
                <th>Profile</th>
                <th>Drifts</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="scans-tbody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel detail-panel hidden" id="detail-panel">
        <div class="panel-header">
          <h2>Scan Detail</h2>
          <button id="close-detail" class="btn btn-secondary btn-sm">Close</button>
        </div>
        <div id="scan-meta" class="scan-meta"></div>
        <div id="summary-cards" class="summary-cards"></div>
        <div id="drift-list" class="drift-list"></div>
      </section>
    </main>
  </div>

  <dialog id="scan-dialog" class="dialog">
    <form method="dialog" id="scan-form">
      <h3>Trigger New Scan</h3>
      <label>
        Provider
        <select name="provider" required>
          <option value="aws">AWS</option>
          <option value="azure">Azure</option>
          <option value="gcp">GCP</option>
        </select>
      </label>
      <label>
        State path or URI
        <input name="state_path" type="text" placeholder="s3://bucket/key or ./terraform.tfstate" required>
      </label>
      <label>
        Regions (comma-separated)
        <input name="regions" type="text" placeholder="us-east-1, us-west-2">
      </label>
      <label>
        Resource types (comma-separated)
        <input name="resource_types" type="text" placeholder="aws_s3_bucket, aws_instance">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="cancel-scan">Cancel</button>
        <button type="submit" class="btn btn-primary">Start Scan</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
